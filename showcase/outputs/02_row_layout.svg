<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<style>
.node { stroke-linejoin: round; }
.edge { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.label { font-family: system-ui, -apple-system, sans-serif; }
</style>
<rect x="0" y="0" width="800" height="600" fill="white" />
<rect x="0" y="0" width="360" height="90" fill="#ffffff" stroke="#d1d5db" stroke-width="1" class="node" />
<text x="10" y="15" fill="#111827" font-size="14" text-anchor="start" class="label" dominant-baseline="middle">Row</text>
<rect x="20" y="20" width="90" height="50" fill="#ffffff" stroke="#d1d5db" stroke-width="1" class="node" />
<text x="65" y="45" fill="#111827" font-size="14" text-anchor="middle" class="label" dominant-baseline="middle">First</text>
<rect x="130" y="20" width="100" height="50" fill="#ffffff" stroke="#d1d5db" stroke-width="1" class="node" />
<text x="180" y="45" fill="#111827" font-size="14" text-anchor="middle" class="label" dominant-baseline="middle">Second</text>
<rect x="250" y="20" width="90" height="50" fill="#ffffff" stroke="#d1d5db" stroke-width="1" class="node" />
<text x="295" y="45" fill="#111827" font-size="14" text-anchor="middle" class="label" dominant-baseline="middle">Third</text>
</svg>